[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-research"
version = "0.1.0"
description = "Multimodal human-human interaction processing and evaluation for robot learning."
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "av>=12",
    "rerun-sdk>=0.20",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Paired-benchmark ML pipeline (src/duet/ml, scripts/*benchmark*, scripts/baseline_*).
# Kept optional so the core adapters stay installable without a deep-learning stack.
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
]
# Object-identity features from ego video (scripts/build_comind_objects.py) and
# utterance embeddings (scripts/build_comind_speech_emb.py).
perception = [
    "ultralytics>=8.2",
    "sentence-transformers>=3.0",
    "projectaria-tools>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
