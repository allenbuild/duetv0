[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-research"
version = "0.1.0"
description = "Multimodal human-human interaction processing and evaluation for robot learning."
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "av>=12",
    "rerun-sdk>=0.20",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
