<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duet EgoExo Playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#0E1312;--panel:#151C1A;--line:#26302D;--ink:#E6ECE9;--mute:#8A9591;--accent:#3FA58C;--warn:#D9B64A;--bad:#E06060;
        --left:#57E39B;--right:#FF6B6B;--body:#B58CFF;--obj:#3EA7FF;--held:#FFD447}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px}
  header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em} header h1 span{color:var(--accent)}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  select,button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:inherit}
  button:hover{border-color:var(--accent)} button.primary{background:var(--accent);color:#06110E;border-color:var(--accent);font-weight:600}
  #stages{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
  .stage{display:flex;gap:6px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:4px;font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)} .done .dot{background:var(--accent)} .running .dot{background:var(--warn);animation:pulse 1s infinite} .failed .dot{background:var(--bad)}
  @keyframes pulse{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.running .dot{animation:none}}
  #transport{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
  #scrub{flex:1} #tlabel{min-width:110px;text-align:right}
  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;padding:10px 16px}
  .view{position:relative;background:#000;border:1px solid var(--line);aspect-ratio:16/9;overflow:hidden}
  .view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .view canvas{position:absolute;inset:0;width:100%;height:100%}
  .view .tag{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--ink);background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px}
  .view .tag b{color:var(--accent)}
  #egos{display:grid;gap:10px} #exos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;grid-column:1/-1}
  #exos .view{aspect-ratio:16/9}
  #side{display:grid;gap:10px;align-content:start}
  .panel{background:var(--panel);border:1px solid var(--line);padding:10px} .panel h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
  #three{width:100%;aspect-ratio:4/3;background:#0B0F0E;display:block}
  table{border-collapse:collapse;width:100%} td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:12px} td.num{text-align:right;font-family:"IBM Plex Mono",monospace}
  #notes{color:var(--mute);font-size:11px;white-space:pre-wrap}
  .legend span{display:inline-block;margin-right:12px;font-size:11px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  @media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><span>Duet</span> EgoExo Playground</h1>
  <label class="mono" style="color:var(--mute)">episode</label>
  <select id="episode"></select>
  <button id="runAll" class="primary">Run pipeline</button>
  <button id="rerun">Re-run all</button>
  <span id="runstate" class="mono" style="color:var(--mute)"></span>
  <span style="flex:1"></span>
  <span class="legend"><span><i style="background:var(--left)"></i>left hand</span><span><i style="background:var(--right)"></i>right hand</span><span><i style="background:var(--body)"></i>body</span><span><i style="background:var(--obj)"></i>object</span><span><i style="background:var(--held)"></i>held</span></span>
</header>
<div id="stages"></div>
<div id="transport">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tlabel" class="mono">0.00 / 0.00 s</span>
  <label class="mono" style="color:var(--mute)"><input type="checkbox" id="showOverlays" checked> overlays</label>
</div>
<main>
  <section id="egos"></section>
  <aside id="side">
    <div class="panel"><h3 id="threeTitle">3D</h3><canvas id="three"></canvas><div id="threeNote" class="mono" style="color:var(--mute);font-size:11px"></div></div>
    <div class="panel"><h3>Quality</h3><table id="qc"><tbody></tbody></table></div>
    <div class="panel"><h3>Alignment &amp; notes</h3><div id="notes" class="mono"></div></div>
  </aside>
  <section id="exos"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
